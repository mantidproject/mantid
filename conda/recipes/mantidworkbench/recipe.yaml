schema_version: 1

context:
  # Version is injected via an environment variable
  version: ${{ env.get('MANTID_VERSION', default='0.0.0') }}
  # Version prefix of the mantiddocs package this workbench can use. mantiddocs is only built for
  # full releases (x.y.z) and nightlies (x.y.YYYYMMDD.HHMM).
  # - nightly (8-digit date patch): match the exact nightly, x.y.YYYYMMDD.HHMM
  # - release/tweak/rc: match x.y.z, dropping any rc suffix on the patch so release
  #   candidates accept the final docs (e.g. 6.16.1rc1 -> 6.16.1, 6.16.0.1rc2 -> 6.16.0)
  docs_version_prefix: ${{ (version | split('.'))[:4] | join('.') if ((version | split('.'))[2] | length) >= 8 else (version | split('.'))[:2] | join('.') ~ '.' ~ ((version | split('.'))[2] | split('rc'))[0] }}

package:
  name: mantidworkbench
  version: ${{ version }}

source:
  path: ../../../

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - workbench = workbench.app.mantidworkbench_launch_wrapper:launch
      - mantidworkbench = workbench.app.mantidworkbench_launch_wrapper:launch
    use_python_app_entrypoint: true

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ninja ${{ ninja }}
    - cmake ${{ cmake }}
    - git
  host:
    - setuptools
    - mantidqt == ${{ version }}
    - python ${{ python }}
    - pip ${{ pip }}
    - tbb-devel ${{ tbb }}
    - if: linux
      then:
        - libgl-devel
        - xorg-libxxf86vm
        - xorg-libx11
        - xorg-xorgproto
  run:
    - ipykernel
    - mantidqt == ${{ version }}
    - psutil ${{ psutil }}
    - python ${{ python }}
    - matplotlib-base ${{ matplotlib }}
    - pyvista ${{ pyvista }}
    - pyvistaqt ${{ pyvistaqt }}
    - superqt
    # qtconsole-base avoids pulling in PyQt5 on the Qt6 build
    - qtconsole-base ${{ qtconsole }}
  run_constraints:
    - mslice ${{ mslice }}
    # pin_compatible can't be used here: it resolves against the host environment and
    # mantiddocs isn't a host dependency. Pin on a prefix of the version instead (see context).
    - mantiddocs ${{ docs_version_prefix }}.*
  ignore_run_exports:
    from_package:
      - ${{ compiler('cxx') }}

tests:
  - python:
      imports:
        - mantid.kernel
        - mantidqt
        - workbench
  - script:
      - mantidworkbench --version

about:
  license: GPL-3.0-or-later
  summary: MantidWorkbench provides a graphical user interface to the Mantid framework, supporting high-performance computing and visualisation of materials science data.
  homepage: https://github.com/mantidproject/mantid

extra:
  recipe-maintainers:
    - thomashampson
    - sf1919
    - martyngigg
    - peterfpeterson
