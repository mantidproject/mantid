name: 'Install pixi environment'
description: |
  Run `pixi install --frozen` under a watchdog, with a bounded number of retries.
  A stalled install on a self-hosted runner otherwise spins until the job timeout. An attempt is
  stopped when it has made no progress for stall-timeout seconds, or after attempt-timeout seconds
  in total, so a slow install that is still making progress is left to finish. Progress is new log
  output, a new package in the rattler cache, or a new package linked into the environment: pixi
  draws its download and link progress bars only on a terminal, so its log can be silent for many
  minutes while it is working. Each attempt's output is streamed to the job log and kept in
  build/test_logs, which the workflows upload.
inputs:
  attempts:
    description: 'Number of attempts before failing'
    required: false
    default: '2'
  stall-timeout:
    description: 'Seconds without any progress before an attempt is treated as hung'
    required: false
    default: '600'
  attempt-timeout:
    description: 'Seconds allowed for each attempt in total, however much output it produces'
    required: false
    default: '1800'
runs:
  using: "composite"
  steps:
    - name: Install pixi environment
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ATTEMPTS: ${{ inputs.attempts }}
        STALL_TIMEOUT: ${{ inputs.stall-timeout }}
        ATTEMPT_TIMEOUT: ${{ inputs.attempt-timeout }}
      run: |
        LOG_DIR="${GITHUB_WORKSPACE}/build/test_logs"
        mkdir -p "${LOG_DIR}"

        # A second pixi waiting on a lock held by the first looks exactly like a hang, so list any
        # that are running whenever an attempt is given up on. The CPU time tells a pixi that is
        # busy from one that is blocked.
        list_pixi_processes() {
          echo "Running pixi processes:"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            tasklist //V //FI "IMAGENAME eq pixi.exe" || true
          else
            ps -o pid,etime,time,args -C pixi || echo "none"
          fi
        }

        if [[ -n "${PIXI_CACHE_DIR:-}" ]]; then
          cache_dir="${PIXI_CACHE_DIR}"
        elif [[ -n "${RATTLER_CACHE_DIR:-}" ]]; then
          cache_dir="${RATTLER_CACHE_DIR}"
        elif [[ "${RUNNER_OS}" == "Windows" ]]; then
          cache_dir="$(cygpath -u "${LOCALAPPDATA}")/rattler/cache"
        else
          cache_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/rattler/cache"
        fi
        conda_meta="${GITHUB_WORKSPACE}/.pixi/envs/default/conda-meta"
        # the directories do not exist until pixi creates them, and a failing find would end the step
        count_entries() {
          { find "$1" -mindepth 1 -maxdepth 1 2>/dev/null || true; } | wc -l
        }
        echo "Watching ${cache_dir}/pkgs for downloads and ${conda_meta} for linked packages"

        # Stop pixi and everything it started. In Git Bash a signal only reaches the MSYS wrapper of
        # a native program, which can leave pixi.exe running and holding its lock, so the Windows
        # process tree is stopped with taskkill instead.
        stop_tree() {
          local pid=$1
          if [[ -r "/proc/${pid}/winpid" ]]; then
            taskkill //F //T //PID "$(cat "/proc/${pid}/winpid")" || true
          else
            # pixi was started in its own session, so its process group shares its pid
            kill -TERM -- "-${pid}" 2>/dev/null || true
            for _ in {1..30}; do
              kill -0 "${pid}" 2>/dev/null || return 0
              sleep 1
            done
            kill -KILL -- "-${pid}" 2>/dev/null || true
          fi
        }

        for (( attempt = 1; attempt <= ATTEMPTS; attempt++ )); do
          log="${LOG_DIR}/pixi_install_attempt_${attempt}.log"
          : > "${log}"
          echo "::group::pixi install attempt ${attempt} of ${ATTEMPTS}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            pixi install --frozen -vv > "${log}" 2>&1 &
          else
            # its own session, so that stop_tree can stop anything pixi started along with it
            setsid pixi install --frozen -vv > "${log}" 2>&1 &
          fi
          pixi_pid=$!
          tail -n +1 -f --pid="${pixi_pid}" "${log}" &
          tail_pid=$!

          started=${SECONDS}
          last_progress=${SECONDS}
          last_state=""
          last_heartbeat=${SECONDS}
          reason=""
          while kill -0 "${pixi_pid}" 2>/dev/null; do
            sleep 10
            cached=$(count_entries "${cache_dir}/pkgs")
            linked=$(count_entries "${conda_meta}")
            state="$(wc -c < "${log}") ${cached} ${linked}"
            if [[ "${state}" != "${last_state}" ]]; then
              last_state=${state}
              last_progress=${SECONDS}
            fi
            if (( SECONDS - last_heartbeat >= 60 )); then
              last_heartbeat=${SECONDS}
              echo "[watchdog] $(( SECONDS - started ))s: ${cached} packages in cache, ${linked} linked, last progress $(( SECONDS - last_progress ))s ago"
            fi
            if (( SECONDS - last_progress >= STALL_TIMEOUT )); then
              reason="no progress for ${STALL_TIMEOUT}s (${cached} packages in cache, ${linked} linked)"
              break
            fi
            if (( SECONDS - started >= ATTEMPT_TIMEOUT )); then
              reason="still running after ${ATTEMPT_TIMEOUT}s"
              break
            fi
          done

          if [[ -n "${reason}" ]]; then
            list_pixi_processes
            stop_tree "${pixi_pid}"
          fi
          status=0
          wait "${pixi_pid}" || status=$?
          kill "${tail_pid}" 2>/dev/null || true
          wait "${tail_pid}" 2>/dev/null || true
          echo "::endgroup::"

          if [[ -z "${reason}" && ${status} -eq 0 ]]; then
            echo "pixi install succeeded on attempt ${attempt} after $(( SECONDS - started ))s"
            exit 0
          fi
          reason=${reason:-"exited with status ${status}"}
          echo "::warning::pixi install attempt ${attempt} of ${ATTEMPTS} stopped: ${reason} after $(( SECONDS - started ))s. Full output in ${log}"
          echo "Last lines of output:"
          tail -n 40 "${log}"
          if (( attempt < ATTEMPTS )); then
            sleep 30
          fi
        done
        echo "::error::pixi install failed after ${ATTEMPTS} attempts"
        exit 1
