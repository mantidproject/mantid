name: PR Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      RUNNER_LABEL:
        description: 'Match Runner Label'
        required: false
        type: string
      CLEAN:
        description: 'Run clean-builder before building. Only available via workflow_dispatch; use Run workflow, not Re-run jobs.'
        required: false
        default: false
        type: boolean


# cancel previous job if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-filters:
    runs-on: ubuntu-latest
    outputs:
      code_changes: ${{ steps.changes.outputs.code_changes }}
      doxygen: ${{ steps.changes.outputs.doxygen }}
      user_docs: ${{ steps.changes.outputs.user_docs }}
      files_cppcheck: ${{ steps.changes.outputs.files_cppcheck }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: .github/filters.yaml

  doxygen:
    needs: [check-filters]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pixi
        if: ${{ needs.check-filters.outputs.doxygen == 'true' }}

      - uses: ./.github/actions/doxygen-build
        name: Build doxygen
        if: ${{ needs.check-filters.outputs.doxygen == 'true' }}

  conda-packaging-linux:
    needs: [cppcheck, doxygen, check-filters]
    timeout-minutes: 150
    runs-on:
      - ${{ (inputs.RUNNER_LABEL == '' && 'self-hosted') || inputs.RUNNER_LABEL }}
      - self-hosted
      - Linux
      - X64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          fetch-tags: true
          path: source

      - uses: ./.github/actions/setup-pixi
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}

      - name: Clean conda package output directory
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        run: |
          rm -rf ${GITHUB_WORKSPACE}/conda-bld

      - name: Build mantid and mantidmpi conda packages
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        run: |
          bash -ex ${GITHUB_WORKSPACE}/source/buildconfig/Jenkins/Conda/package-conda ${GITHUB_WORKSPACE} --build-mantid

      - name: Build mantidqt conda package
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        run: |
          bash -ex ${GITHUB_WORKSPACE}/source/buildconfig/Jenkins/Conda/package-conda ${GITHUB_WORKSPACE} --build-qt

      - name: Build mantiddocs conda package
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        run: |
          bash -ex ${GITHUB_WORKSPACE}/source/buildconfig/Jenkins/Conda/package-conda ${GITHUB_WORKSPACE} --build-docs

      - name: Build mantidworkbench conda package
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        run: |
          bash -ex ${GITHUB_WORKSPACE}/source/buildconfig/Jenkins/Conda/package-conda ${GITHUB_WORKSPACE} --build-workbench

      - name: Upload conda packages
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda_packages
          if-no-files-found: error
          path: ${{ github.workspace }}/conda-bld/**/*.conda

      - name: Upload conda environment logs
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: env_logs
          if-no-files-found: warn
          path: ${{ github.workspace }}/**/env_logs/*/*.txt

  cppcheck:
    needs: [check-filters]
    timeout-minutes: 60
    runs-on:
      - ${{ (inputs.RUNNER_LABEL == '' && 'self-hosted') || inputs.RUNNER_LABEL }}
      - self-hosted
      - Linux
      - X64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pixi
        uses: ./.github/actions/setup-pixi
        if: ${{ needs.check-filters.outputs.files_cppcheck == 'true' }}

      - name: Clean build tree
        if: ${{ needs.check-filters.outputs.files_cppcheck == 'true' }}
        run: ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/clean-builder ${GITHUB_WORKSPACE}

      - name: Add cppcheck matcher
        if: ${{ needs.check-filters.outputs.files_cppcheck == 'true' }}
        run: echo "::add-matcher::.github/matchers/cppcheck.json"

      - uses: ./.github/actions/cppcheck-build
        if: ${{ needs.check-filters.outputs.files_cppcheck == 'true' }}
        name: Run cppcheck

      - name: Remove cppcheck matcher
        if: ${{ always() && needs.check-filters.outputs.files_cppcheck == 'true' }}
        run: echo "::remove-matcher owner=cppcheck::"

      - name: Upload cppcheck SARIF report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.check-filters.outputs.files_cppcheck == 'true' && hashFiles('build/cppcheck.sarif') != '' }}
        with:
          name: cppcheck_sarif_report
          if-no-files-found: warn
          path: ${{ github.workspace }}/build/cppcheck.sarif


  build-and-test:
    needs: [cppcheck, doxygen, check-filters]
    # Without a limit a hung step holds the runner for GitHub's six hour default
    timeout-minutes: 180
    permissions:
      contents: read

    strategy:
      # failed jobs in the matrix don't cancel each other
      fail-fast: false
      matrix:
        # Skip Windows when the PR targets ornl-next (ORNL-specific branch, Linux only)
        # Windows builds with Ninja rather than Visual Studio so that ccache can be used
        include: ${{ fromJson(github.base_ref == 'ornl-next' && '[{"os":"Linux","cmake_preset":"linux-64-ci"}]' || '[{"os":"Linux","cmake_preset":"linux-64-ci"},{"os":"Windows","cmake_preset":"win-64-ci"}]') }}

    runs-on:
      - ${{ (inputs.RUNNER_LABEL == '' && 'self-hosted') || inputs.RUNNER_LABEL }}
      - self-hosted
      - ${{ matrix.os }}
      - X64
    #
    # If the user who clicked "Run Workflow" button left the RUNNER_LABEL field blank,
    # the default evaluated output is the string 'self-hosted'.
    # Otherwise set it to the value the user specified when they clicked "Run Workflow"
    #

    defaults:
      run:
        shell: bash

    env:
      CMAKE_PRESET: ${{ matrix.cmake_preset }}
      EXTRA_CMAKE_FLAGS: "-DENABLE_PRECOMMIT=OFF"
      ENABLE_BUILD_CODE: true
      ENABLE_UNIT_TESTS: true
      ENABLE_SYSTEM_TESTS: ${{ matrix.os == 'Linux' }}
      ENABLE_DOCS: false
      ENABLE_DOC_TESTS: false
      ENABLE_DEV_DOCS: false
      # Records this job's cache hits and misses, which the shared cache statistics cannot
      # separate from those of other runners on the same host
      CCACHE_STATSLOG: ${{ github.workspace }}/build/test_logs/ccache_stats.log
      # Temporary, while the move to Ninja without precompiled headers exposes headers that do
      # not include what they use under MSVC: report every compile error in one run, not only
      # the first. Remove once the Windows build is clean.
      BUILD_KEEP_GOING: ${{ matrix.os == 'Windows' }}

    steps:
      - name: Print shell environment vars (debug)
        if: github.event_name == 'workflow_dispatch'
        run: |
          env -0 | while IFS='' read -d '' line ; do printf '%s\t: %s\n' "${line%%=*}" "${line#*=}" | expand -t 30 | sed ':a;N;$!ba;s/\n/ /g'; done | LC_COLLATE=C sort -b

      #
      # If this workflow was triggered manually,
      # print a sorted list of all shell environment variables
      #

      # A cancelled or timed out job can leave processes behind (pixi, python, test executables)
      # that keep files in the workspace open. Windows will not delete an open file, so the
      # checkout's git clean, clean-builder or pixi then fail or wait. Only processes whose
      # executable lives under this runner's workspace or temp directory are stopped, so other
      # runners on the same host are not touched. This must run before checkout.
      - name: Stop stray processes from earlier jobs
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $roots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | Where-Object { $_ } |
            ForEach-Object { [System.IO.Path]::GetFullPath($_).TrimEnd('\') + '\' }
          $stray = Get-Process | Where-Object {
            $path = $_.Path
            $path -and ($roots | Where-Object { $path.StartsWith($_, [System.StringComparison]::OrdinalIgnoreCase) })
          }
          foreach ($proc in $stray) {
            Write-Host "Stopping $($proc.Id) $($proc.Path)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to fetch the tags for versioningit
          fetch-depth: 100
          fetch-tags: true

      - name: Install pixi
        uses: ./.github/actions/setup-pixi
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}

      - name: Clean build tree
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        run: |
          CLEAN_ARGS=""
          if [ "${{ inputs.CLEAN }}" == "true" ]; then
            CLEAN_ARGS="--clean-build"
          fi
          ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/clean-builder ${GITHUB_WORKSPACE} ${CLEAN_ARGS}

      - name: Determine if a PR build
        if: ${{ github.event_name == 'pull_request' && needs.check-filters.outputs.code_changes == 'true' }}
        # telling jenkins scripts this is a PR build
        run: echo "JOB_NAME=pull_requests" >> $GITHUB_ENV

      - name: Register GCC Problem Matchers
        if: ${{ matrix.os == 'Linux' }}
        run: echo "::add-matcher::.github/matchers/gcc.json"

      - name: Register MSVC Problem Matchers
        if: ${{ matrix.os == 'Windows' }}
        run: echo "::add-matcher::.github/matchers/msvc.json"

      # The cache lives in the runner user's profile and is shared by every runner on the host.
      # BASEDIR makes paths relative to the workspace so that runners with different workspace
      # directories hit each other's entries. The default size of 5G holds less than one build.
      - name: Configure ccache
        if: ${{ matrix.os == 'Windows' }}
        run: |
          {
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_MAXSIZE=30G"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"

      - name: Install pixi environment
        uses: ./.github/actions/install-pixi-env
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        # backstop only: the action stops a hung attempt itself, after 10 minutes without output,
        # and allows two attempts of up to 30 minutes each
        timeout-minutes: 65

      - name: Build code
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        timeout-minutes: 100
        run: |
          set -o pipefail
          echo "For Jenkins scripts JOB_NAME=${JOB_NAME}"
          cd ${GITHUB_WORKSPACE}
          # 2>&1 is required as compiler diagnostics are written to stderr, and the
          # warning check in the next step reads them back out of this log
          mkdir -p ${GITHUB_WORKSPACE}/build/test_logs/
          pixi run --frozen bash -ex ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/build ${GITHUB_WORKSPACE} $CMAKE_PRESET $ENABLE_DOCS $ENABLE_DEV_DOCS $ENABLE_BUILD_CODE $ENABLE_UNIT_TESTS $ENABLE_SYSTEM_TESTS $ENABLE_DOC_TESTS $EXTRA_CMAKE_FLAGS 2>&1 \
              | tee ${GITHUB_WORKSPACE}/build/test_logs/build_${{ matrix.os }}.log

      - name: Show ccache statistics
        if: ${{ !cancelled() && needs.check-filters.outputs.code_changes == 'true' && hashFiles('build/test_logs/ccache_stats.log') != '' }}
        run: |
          {
            echo "### ccache statistics for this build (${{ matrix.os }})"
            echo
            echo '```'
            pixi run --frozen ccache --show-log-stats -v
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove GCC Problem Matchers
        if: ${{ matrix.os == 'Linux' }}
        run: echo "::remove-matcher owner=gcc-problem-matcher::"

      - name: Remove MSVC Problem Matchers
        if: ${{ matrix.os == 'Windows' }}
        run: echo "::remove-matcher owner=msvc-problem-matcher::"

      # Runs after the whole build has completed so that every warning is reported at once,
      # and before the tests so that a warning stops the job from proceeding any further.
      # The parser understands both the gcc and the MSVC diagnostic formats, so the same
      # check covers the Linux and the Windows build.
      # TODO: Needs to be expanded for clang on osx.
      - uses: ./.github/actions/check-build-warnings
        name: Check for compiler warnings
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        with:
          log-file: build/test_logs/build_${{ matrix.os }}.log
          os: ${{ matrix.os }}

      - name: Run unit tests
        if: ${{ needs.check-filters.outputs.code_changes == 'true' }}
        id: testunit
        timeout-minutes: 90
        run: |
          cd ${GITHUB_WORKSPACE}
          # Not physical but logical cores, includes hyper threaded - different for darwin
          BUILD_THREADS="$(grep -c ^processor /proc/cpuinfo)"
          # bool flags for this are
          # SYSTEM_TESTS UNIT_TESTS DOCS DOC_TESTS
          pixi run --frozen bash -ex ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/run-tests ${GITHUB_WORKSPACE} false true $ENABLE_DOCS $ENABLE_DOC_TESTS ${BUILD_THREADS}

      # Lists where the unit test time goes, to guide work on the test stage. clean-builder removes
      # build/Testing before each run, so the cost data covers this run only.
      - name: Summarise slowest unit tests
        if: ${{ !cancelled() && steps.testunit.conclusion != 'skipped' && hashFiles('build/Testing/Temporary/CTestCostData.txt') != '' }}
        run: |
          {
            echo "### Slowest unit tests (${{ matrix.os }})"
            echo
            echo "| Seconds | Test |"
            echo "|--:|:--|"
            # each line is "<name> <runs> <average seconds>"; the failed test list follows "---".
            # The final awk reads all of its input rather than stopping at 30 lines, as head would,
            # because closing the pipe early fails sort with SIGPIPE under pipefail.
            awk '/^---/ { exit } NF >= 3 { printf "%.1f %s\n", $3, $1 }' \
                ${GITHUB_WORKSPACE}/build/Testing/Temporary/CTestCostData.txt \
              | sort -rn | awk 'NR <= 30 { printf "| %s | %s |\n", $1, $2 }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive unit test output (Linux)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.os == 'Linux' && !cancelled() && github.event_name == 'pull_request' && steps.testunit.conclusion != 'skipped' }}
        with:
          name: junit-unit-Linux
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/Testing/*unittest.xml

      - name: Archive unit test output (Windows)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.os == 'Windows' && !cancelled() && github.event_name == 'pull_request' && steps.testunit.conclusion != 'skipped' }}
        with:
          name: junit-unit-Windows
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/Testing/*unittest.xml

      - name: Run system tests
        if: ${{ matrix.os == 'Linux' && needs.check-filters.outputs.code_changes == 'true' }}
        id: testsystem
        timeout-minutes: 90
        run: |
          cd ${GITHUB_WORKSPACE}
          # Not physical but logical cores, includes hyper threaded - different for darwin
          BUILD_THREADS="$(grep -c ^processor /proc/cpuinfo)"
          # bool flags for this are
          # SYSTEM_TESTS UNIT_TESTS DOCS DOC_TESTS
          pixi run --frozen bash -ex ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/run-tests ${GITHUB_WORKSPACE} true false $ENABLE_DOCS $ENABLE_DOC_TESTS ${BUILD_THREADS}

      - name: Upload system test mismatch files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.os == 'Linux' && failure() && steps.testsystem.conclusion == 'failure' }}
        with:
          name: system_test_mismatches
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/**/*-mismatch.nxs

      - name: Archive system test output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.os == 'Linux' && !cancelled() && github.event_name == 'pull_request' && steps.testsystem.conclusion != 'skipped' }}
        with:
          name: junit-system
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/Testing/SystemTests/**/TEST-systemtests*.xml

      - name: Upload event payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.os == 'Linux' && !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: event-file
          path: ${{ github.event_path }}

      - name: Upload build and test log artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test_logs_${{ matrix.os }}
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/test_logs/*.log


  user-docs-build-and-test:
    needs: [cppcheck, doxygen, check-filters]
    timeout-minutes: 120
    permissions:
      contents: read

    runs-on:
      - ${{ (inputs.RUNNER_LABEL == '' && 'self-hosted') || inputs.RUNNER_LABEL }}
      - self-hosted
      - Linux
      - X64

    defaults:
      run:
        shell: bash

    env:
      CMAKE_PRESET: linux-64-ci
      EXTRA_CMAKE_FLAGS: "-DENABLE_PRECOMMIT=OFF"
      ENABLE_BUILD_CODE: true
      ENABLE_UNIT_TESTS: false
      ENABLE_SYSTEM_TESTS: false
      ENABLE_DOCS: true
      ENABLE_DOC_TESTS: true
      # Developer docs are built and published separately by devdocs-publish.yml
      ENABLE_DEV_DOCS: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to fetch the tags for versioningit
          fetch-depth: 100
          fetch-tags: true

      - name: Install pixi
        uses: ./.github/actions/setup-pixi
        if: ${{ needs.check-filters.outputs.user_docs == 'true' }}

      - name: Clean build tree
        if: ${{ needs.check-filters.outputs.user_docs == 'true' }}
        run: |
          CLEAN_ARGS=""
          if [ "${{ inputs.CLEAN }}" == "true" ]; then
            CLEAN_ARGS="--clean-build"
          fi
          ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/clean-builder ${GITHUB_WORKSPACE} ${CLEAN_ARGS}

      - name: Install pixi environment
        uses: ./.github/actions/install-pixi-env
        if: ${{ needs.check-filters.outputs.user_docs == 'true' }}
        # backstop only: the action stops a hung attempt itself, after 10 minutes without output,
        # and allows two attempts of up to 30 minutes each
        timeout-minutes: 65

      - name: Build code and user docs
        if: ${{ needs.check-filters.outputs.user_docs == 'true' }}
        timeout-minutes: 100
        run: |
          cd ${GITHUB_WORKSPACE}
          echo "::add-matcher::.github/matchers/gcc.json"
          pixi run --frozen bash -ex ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/build ${GITHUB_WORKSPACE} $CMAKE_PRESET $ENABLE_DOCS $ENABLE_DEV_DOCS $ENABLE_BUILD_CODE $ENABLE_UNIT_TESTS $ENABLE_SYSTEM_TESTS $ENABLE_DOC_TESTS $EXTRA_CMAKE_FLAGS
          echo "::remove-matcher owner=gcc-problem-matcher::"

      - name: Run doctests
        if: ${{ needs.check-filters.outputs.user_docs == 'true' }}
        id: testdocs
        timeout-minutes: 60
        run: |
          cd ${GITHUB_WORKSPACE}
          # Not physical but logical cores, includes hyper threaded - different for darwin
          BUILD_THREADS="$(grep -c ^processor /proc/cpuinfo)"
          # bool flags for this are
          # SYSTEM_TESTS UNIT_TESTS DOCS DOC_TESTS
          pixi run --frozen bash -ex ${GITHUB_WORKSPACE}/buildconfig/Jenkins/Conda/run-tests ${GITHUB_WORKSPACE} false false $ENABLE_DOCS $ENABLE_DOC_TESTS ${BUILD_THREADS}

      - name: Upload doctest results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.testdocs.conclusion != 'skipped' }}
        with:
          name: junit-doctest
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/docs/doctest/TEST-doctest.xml

      - name: Upload event payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: event-file-doctest
          path: ${{ github.event_path }}

      - name: Upload build and test log artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: user_docs_test_logs_Linux
          if-no-files-found: ignore
          path: ${{ github.workspace }}/build/test_logs/*.log
