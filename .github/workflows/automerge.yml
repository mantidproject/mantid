name: Merge protected branches

on:
  workflow_dispatch:
  push:
    branches: [ornl-next, release-next]
  pull_request:
    paths:
      - .github/workflows/automerge.yml

permissions:
  contents: read

jobs:
  merge-into-main:
    runs-on: ubuntu-latest
    # Do not run in forks
    if: ${{ github.repository_owner == 'mantidproject' }}

    env:
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout ${{ env.SOURCE_BRANCH }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # get commits but not the blobs until needed

      - name: Record commit to merge
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Switch to main
        run: git switch -C main origin/main

      - name: Set committer information
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge ${{ env.SOURCE_BRANCH }} into main
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git merge --no-ff "${SOURCE_SHA}" \
            -m "Merge ${SOURCE_BRANCH} into main"

      - name: Push merge commit
        if: ${{ github.event_name != 'pull_request' }}
        run: git push origin main
