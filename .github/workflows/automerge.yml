name: Merge protected branches

on:
  workflow_dispatch:
  push:
    branches: [ornl-next, release-next]

permissions:
  contents: read

jobs:
  merge-into-main:
    runs-on: ubuntu-latest
    # Do not run in forks
    if: ${{ github.repository_owner == 'mantidproject' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_TOKEN }}

      - name: Merge ${{ github.ref_name }} into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main "${{ github.ref_name }}"

          git checkout main
          git merge --no-ff "origin/${{ github.ref_name }}" \
            -m "Merge ${{ github.ref_name }} into main"

          git push origin main
