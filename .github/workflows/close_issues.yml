name: Close issues with PRs merged into release-next.

on:
  pull_request_target:
    types: [closed]
    branches:
      - release-next

jobs:
  close-issue-on-pr-merge:
    # Do not run in forks.
    if: ${{ github.repository_owner == 'mantidproject' }}
    runs-on: ubuntu-latest
    steps:
      - name: Closes issues related to a merged pull request.
        uses: ldez/gha-mjolnir@5574ed1f1151e4d2f11e3513cd85920a3a46bb7b # v1.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
