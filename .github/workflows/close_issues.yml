name: Close issues with PRs merged into release-next.

on:
  pull_request_target:
    types: [closed]
    branches:
      - release-next

permissions:
  contents: read

jobs:
  close-issue-on-pr-merge:
    # Do not run in forks.
    if: ${{ github.repository_owner == 'mantidproject' }}
    permissions:
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Closes issues related to a merged pull request.
        uses: ldez/gha-mjolnir@2b6cbdc86ddbe6e54b4f8056f7d6e60825313336 # v1.5.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
