name: Grype Scan

on:
  pull_request:
    paths:
      - .github/workflows/grype.yml
      - .grype.yaml
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the install and scan but skip SARIF upload'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan-package:
    if: ${{ github.repository_owner == 'mantidproject' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: windows-latest
            platform: win-64

    steps:
      - name: Checkout workflow dependencies
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/grype.yml
            .github/actions/setup-pixi/
            .grype.yaml
            .pixi-version
          sparse-checkout-cone-mode: false

      - name: Setup pixi
        uses: ./.github/actions/setup-pixi

      - name: Create temporary pixi project
        id: pixi-project
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # git-bash reports RUNNER_TEMP with backslashes - use a mixed path
            # (e.g. D:/a/_temp) that both bash and native executables accept
            project_dir="$(cygpath --mixed "$RUNNER_TEMP")/grype-scan"
          else
            project_dir="${RUNNER_TEMP}/grype-scan"
          fi
          mkdir -p "$project_dir"
          cat > "$project_dir/pixi.toml" <<'EOF'
          [workspace]
          channels = ["conda-forge", "mantid/label/nightly", "mantid", "neutrons"]
          platforms = ["${{ matrix.platform }}"]

          [dependencies]
          mantidworkbench = "*"
          mslice = "*"
          pystog = ">=0.6.3"
          EOF

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "environment_dir=$project_dir/.pixi/envs/default" >> "$GITHUB_OUTPUT"

      - name: Log temporary pixi project
        shell: bash
        run: cat "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"

      - name: Install scan environment
        shell: bash
        run: pixi install --manifest-path "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"

      - name: List versions installed
        shell: bash
        run: |
          echo "Top level dependencies"
          pixi list --explicit --manifest-path "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"
          echo "::group::All dependencies"
          pixi list --manifest-path "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"
          echo "::endgroup::"
      - name: Scan with Grype
        id: scan
        uses: anchore/scan-action@v7
        with:
          path: ${{ steps.pixi-project.outputs.environment_dir }}
          fail-build: false
          only-fixed: true

      - name: Normalize SARIF paths
        # grype prepends the scan root to every location unless the location is
        # already absolute. On windows "\conda-meta\..." is not absolute to go, so
        # results come out as "D:/.../default/\conda-meta\openssl.json" and code
        # scanning rejects the file - it reads the "D:" drive letter as a URI
        # scheme. Rewrite the locations relative to the scanned environment, which
        # is the form grype already emits on linux.
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        env:
          ENV_DIR: ${{ steps.pixi-project.outputs.environment_dir }}
        run: |
          sarif=$(cygpath --mixed "${{ steps.scan.outputs.sarif }}")
          jq --arg root "$ENV_DIR" '
            (.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation.uri) |=
              ( gsub("\\\\"; "/")
              | if startswith($root) then .[($root | length):] else . end
              | gsub("/+"; "/")
              | if startswith("/") then . else "/" + . end )
          ' "$sarif" > "$sarif.normalized"
          mv "$sarif.normalized" "$sarif"
          echo "::group::Normalized locations"
          jq -r '[.runs[].results[].locations[].physicalLocation.artifactLocation.uri] | unique | .[]' "$sarif"
          echo "::endgroup::"

      - name: Upload vulnerability report
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          # distinct category per platform so matrix uploads do not overwrite each other
          category: grype-${{ matrix.platform }}
