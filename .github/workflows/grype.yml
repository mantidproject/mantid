name: Grype Scan

on:
  pull_request:
    paths:
      - .github/workflows/grype.yml
      - .github/actions/grype/merge_sarif.py
      - .grype.yaml
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the install and scan but skip SARIF upload'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan-package:
    if: ${{ github.repository_owner == 'mantidproject' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: windows-latest
            platform: win-64
          - os: macos-latest
            platform: osx-arm64

    steps:
      - name: Checkout workflow dependencies
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/grype.yml
            .github/actions/setup-pixi/
            .grype.yaml
            .pixi-version
          sparse-checkout-cone-mode: false

      - name: Setup pixi
        uses: ./.github/actions/setup-pixi

      - name: Create temporary pixi project
        id: pixi-project
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # git-bash reports RUNNER_TEMP with backslashes - use a mixed path
            # (e.g. D:/a/_temp) that both bash and native executables accept
            project_dir="$(cygpath --mixed "$RUNNER_TEMP")/grype-scan"
          else
            project_dir="${RUNNER_TEMP}/grype-scan"
          fi
          mkdir -p "$project_dir"
          cat > "$project_dir/pixi.toml" <<'EOF'
          [workspace]
          channels = ["conda-forge", "mantid/label/nightly", "mantid", "neutrons"]
          platforms = ["${{ matrix.platform }}"]

          [dependencies]
          # Take the latest nightly workbench/Mantid stack
          # Keep mslice on the stable mantid channel so Pixi does not prefer a nightly
          mantidworkbench = { version = "*", channel = "mantid/label/nightly" }
          mslice = { version = "*", channel = "mantid" }
          pystog = ">=0.6.3"
          EOF

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "environment_dir=$project_dir/.pixi/envs/default" >> "$GITHUB_OUTPUT"

      - name: Log temporary pixi project
        shell: bash
        run: cat "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"

      - name: Install scan environment
        shell: bash
        run: pixi install --manifest-path "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"

      - name: List versions installed
        shell: bash
        run: |
          echo "Top level dependencies"
          pixi list --explicit --manifest-path "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"
          echo "::group::All dependencies"
          pixi list --manifest-path "${{ steps.pixi-project.outputs.project_dir }}/pixi.toml"
          echo "::endgroup::"
      - name: Scan with Grype
        id: scan
        uses: anchore/scan-action@v7
        with:
          path: ${{ steps.pixi-project.outputs.environment_dir }}
          fail-build: false
          only-fixed: true

      - name: Stage SARIF report
        id: report
        shell: bash
        env:
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source_path=$(cygpath --mixed "$SARIF")
            temp_dir=$(cygpath --mixed "$RUNNER_TEMP")
          else
            source_path="$SARIF"
            temp_dir="$RUNNER_TEMP"
          fi
          # the merge job reads the platform from the file name
          report="$temp_dir/grype-${{ matrix.platform }}.sarif"
          cp "$source_path" "$report"
          echo "path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF report
        uses: actions/upload-artifact@v7
        with:
          name: grype-sarif-${{ matrix.platform }}
          path: ${{ steps.report.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  merge-and-upload:
    # every platform has to report for the platform labels to be complete, so
    # this deliberately does not run when one leg of the matrix failed
    needs: scan-package
    if: ${{ github.repository_owner == 'mantidproject' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow dependencies
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/grype/merge_sarif.py
          sparse-checkout-cone-mode: false

      - name: Download SARIF reports
        uses: actions/download-artifact@v8
        with:
          pattern: grype-sarif-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true

      - name: Merge SARIF reports
        run: |
          python3 .github/actions/grype/merge_sarif.py \
            "${{ runner.temp }}/grype.sarif" "${{ runner.temp }}"/reports/grype-*.sarif

      - name: Upload vulnerability report
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/grype.sarif
          # one category for all platforms, so the merged results are a single analysis
          category: grype
      - name: Remove SARIF file
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: rm ${{ runner.temp }}/grype.sarif
